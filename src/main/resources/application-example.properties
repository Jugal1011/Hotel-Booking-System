spring.application.name=hotelBookingSystem
pricing.update.cron=${PRICING_UPDATE_CRON:*/20 * * * * *}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1200000}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Frontend Configuration
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Server Configuration
server.servlet.context-path=/api/v1

# Default hotel manager (provide credentials through environment variables)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# JWT Configuration
jwt.secretKey=${JWT_SECRET_KEY}

# Stripe Secret Key
stripe.secret.key={STRIPE_SECRET_KEY}
stripe.webhook.secret={STRIPE_WEBHOOK_SECRET}